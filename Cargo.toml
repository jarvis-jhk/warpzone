[workspace]
resolver = "2"
members = [
  "crates/protocol",
  "crates/server",
  "crates/core",
  "crates/capi",
  "crates/cli",
  "crates/launcher",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jarvis-jhk/warpzone"
homepage = "https://warpzone.virtualtabletop.io"
rust-version = "1.99"

[workspace.dependencies]
warpzone-protocol = { path = "crates/protocol" }
warpzone-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.9"
ed25519-dalek = "2"
thiserror = "2"
log = "0.4"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
field_reassign_with_default = "allow"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Dependencies (hashing, inflate, crypto) optimized even in debug builds, so
# tests and local runs are not CPU-bound on them.
[profile.dev.package."*"]
opt-level = 2
