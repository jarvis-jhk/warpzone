name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (launcher controller support)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      - name: Game descriptors
        run: cargo run -q -p warpzone-server -- check-games games
      - name: C example against the static library
        run: make -C examples/c
      - run: cargo clippy --workspace -- -D warnings
      - name: Pure-Rust crypto (no ring)
        run: |
          cargo clippy --workspace --all-targets --no-default-features --features pure-rust-crypto -- -D warnings
          cargo test -p warpzone-core --no-default-features --features pure-rust-crypto
          ! cargo tree --workspace --no-default-features --features pure-rust-crypto -i ring 2>/dev/null | grep -q ring

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      # Separate builds: the capi warpzone.dll and the launcher warpzone.exe both write
      # warpzone.pdb, and linking them in parallel fails with LNK1201 (cargo#6313).
      - run: cargo build -p warpzone-capi
      - run: cargo build -p warpzone-cli -p warpzone-launcher
      - run: cargo test -p warpzone-protocol -p warpzone-core

  macos:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p warpzone-capi -p warpzone-cli -p warpzone-launcher
      - run: cargo test -p warpzone-protocol -p warpzone-core -p warpzone-capi -p warpzone-cli -p warpzone-launcher
      - name: Intel build (cross from Apple Silicon)
        run: cargo build --target x86_64-apple-darwin -p warpzone-capi -p warpzone-cli -p warpzone-launcher
      - name: C example against the static library
        run: |
          set -eu
          cargo build --release -p warpzone-capi
          L=$(cargo rustc -q --release -p warpzone-capi --crate-type staticlib -- --print native-static-libs 2>&1 | grep -o 'native-static-libs: .*' | cut -d' ' -f2-)
          make -C examples/c LDLIBS="$L"

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .toolchain/android/downloads
          key: android-toolchain-${{ hashFiles('tools/fetch-android.sh') }}
      - run: tools/fetch-android.sh && JAVA_HOME= ANDROID_HOME= android/build.sh
