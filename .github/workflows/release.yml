# Tag vX.Y.Z → build every artifact, publish a GitHub release with SHA256SUMS.
name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,aarch64-unknown-linux-gnu,x86_64-pc-windows-gnu
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - run: cargo install --locked cargo-zigbuild
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: |
          set -eux
          V=${GITHUB_REF_NAME#v}
          mkdir -p dist notices
          # Licenses and notices of the statically linked Rust crates, in every archive.
          for c in capi cli launcher; do tools/third-party-notices.sh warpzone-$c notices/$c.html; done
          legal() { cp LICENSE-MIT LICENSE-APACHE $1/; cp notices/$2.html $1/THIRD-PARTY-NOTICES.html; }
          # Server: static musl binaries.
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cargo zigbuild --release --target $t -p warpzone-server
            arch=${t%%-*}
            cp target/$t/release/warpzone-server dist/warpzone-server-$V-$arch-linux-musl
          done
          # C library: x86_64 glibc, aarch64 glibc 2.27 (PortMaster handhelds), mingw.
          cargo build --release -p warpzone-capi
          libs() { cargo rustc -q --release -p warpzone-capi --crate-type staticlib $1 -- --print native-static-libs 2>&1 | grep -o 'native-static-libs: .*' || true; }
          pkg() { d=libwarpzone-$V-$1; mkdir -p $d/lib $d/include; cp crates/capi/include/warpzone.h $d/include/; cp $2 $d/lib/; legal $d capi; echo "$3" > $d/NATIVE_LIBS.txt; tar -czf dist/$d.tar.gz $d; rm -rf $d; }
          pkg x86_64-linux-gnu "target/release/libwarpzone.a target/release/libwarpzone.so" "$(libs)"
          cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.27 -p warpzone-capi
          pkg aarch64-linux-gnu "target/aarch64-unknown-linux-gnu/release/libwarpzone.a target/aarch64-unknown-linux-gnu/release/libwarpzone.so" "native-static-libs: -lgcc_s -lutil -lrt -lpthread -lm -ldl -lc"
          cargo zigbuild --release --target x86_64-pc-windows-gnu -p warpzone-capi
          d=libwarpzone-$V-x86_64-windows-gnu; mkdir -p $d/lib $d/include; cp crates/capi/include/warpzone.h $d/include/; cp target/x86_64-pc-windows-gnu/release/libwarpzone.a target/x86_64-pc-windows-gnu/release/warpzone.dll $d/lib/; legal $d capi; echo "native-static-libs: -lkernel32 -ladvapi32 -lntdll -luserenv -lws2_32 -lbcrypt -ldbghelp" > $d/NATIVE_LIBS.txt; zip -qr dist/$d.zip $d; rm -rf $d
          # CLI and launcher for Linux.
          cargo zigbuild --release --target x86_64-unknown-linux-musl -p warpzone-cli
          d=wz-$V-x86_64-linux; mkdir -p $d; cp target/x86_64-unknown-linux-musl/release/wz $d/; legal $d cli; tar -czf dist/$d.tar.gz $d; rm -rf $d
          cargo build --release -p warpzone-launcher
          d=warpzone-launcher-$V-linux-x86_64; mkdir -p $d; cp target/release/warpzone packaging/linux/warpzone.desktop $d/; legal $d launcher; tar -czf dist/$d.tar.gz $d
          # Self-updating AppImage (plus its .zsync for AppImageUpdate), with the same legal files.
          bash packaging/linux/build-appimage.sh target/release/warpzone $V dist $d
          rm -rf $d
          # Steam Deck: open in Desktop Mode; installs the AppImage and adds it to Steam.
          cp "packaging/steamdeck/Install Warpzone.desktop" dist/Install-Warpzone.desktop
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - shell: bash
        run: |
          set -eux
          V=${GITHUB_REF_NAME#v}
          mkdir -p dist notices
          for c in capi cli launcher; do tools/third-party-notices.sh warpzone-$c notices/$c.html; done
          legal() { cp LICENSE-MIT LICENSE-APACHE $1/; cp notices/$2.html $1/THIRD-PARTY-NOTICES.html; }
          # Separately: warpzone.dll and warpzone.exe share warpzone.pdb (LNK1201 race, cargo#6313).
          cargo build --release -p warpzone-capi
          cargo build --release -p warpzone-cli -p warpzone-launcher
          d=libwarpzone-$V-x86_64-windows-msvc; mkdir -p $d/lib $d/include
          cp crates/capi/include/warpzone.h $d/include/; cp target/release/warpzone.lib target/release/warpzone.dll target/release/warpzone.dll.lib $d/lib/ || true
          cargo rustc -q --release -p warpzone-capi --crate-type staticlib -- --print native-static-libs 2>&1 | grep -o 'native-static-libs: .*' > $d/NATIVE_LIBS.txt || true
          legal $d capi
          7z a dist/$d.zip $d >/dev/null
          d=wz-$V-windows-x86_64; mkdir -p $d; cp target/release/wz.exe $d/; legal $d cli; 7z a dist/$d.zip $d >/dev/null
          d=warpzone-launcher-$V-windows-x86_64; mkdir -p $d; cp target/release/warpzone.exe $d/; legal $d launcher; 7z a dist/$d.zip $d >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Build (universal arm64 + x86_64, macOS 11+)
        run: |
          set -eux
          V=${GITHUB_REF_NAME#v}
          mkdir -p dist notices
          for c in capi cli launcher; do tools/third-party-notices.sh warpzone-$c notices/$c.html; done
          legal() { cp LICENSE-MIT LICENSE-APACHE $1/; cp notices/$2.html $1/THIRD-PARTY-NOTICES.html; }
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target $t -p warpzone-capi
            cargo build --release --target $t -p warpzone-cli -p warpzone-launcher
          done
          uni() { lipo -create target/aarch64-apple-darwin/release/$1 target/x86_64-apple-darwin/release/$1 -output $2; lipo -info $2; }
          # C library: static and dynamic, one universal file each.
          d=libwarpzone-$V-universal-apple-darwin; mkdir -p $d/lib $d/include
          cp crates/capi/include/warpzone.h $d/include/
          uni libwarpzone.a $d/lib/libwarpzone.a
          uni libwarpzone.dylib $d/lib/libwarpzone.dylib
          install_name_tool -id @rpath/libwarpzone.dylib $d/lib/libwarpzone.dylib
          codesign --force --sign - $d/lib/libwarpzone.dylib
          cargo rustc -q --release --target aarch64-apple-darwin -p warpzone-capi --crate-type staticlib -- --print native-static-libs 2>&1 | grep -o 'native-static-libs: .*' > $d/NATIVE_LIBS.txt
          cat $d/NATIVE_LIBS.txt
          echo "minimum macOS: 11.0 (MACOSX_DEPLOYMENT_TARGET)" >> $d/NATIVE_LIBS.txt
          legal $d capi
          # The archived library must link: the C example against it, both arches.
          for a in arm64 x86_64; do make -B -C examples/c CC="cc -arch $a" LIB=$PWD/$d/lib/libwarpzone.a INC=$PWD/$d/include LDLIBS="$(head -1 $d/NATIVE_LIBS.txt | cut -d' ' -f2-)"; lipo -info examples/c/echo; done
          tar -czf dist/$d.tar.gz $d; rm -rf $d
          # CLI.
          d=wz-$V-macos-universal; mkdir -p $d; uni wz $d/wz; legal $d cli; tar -czf dist/$d.tar.gz $d; rm -rf $d
          # Launcher: Warpzone.app (self-updates its binary like the Linux tarball).
          d=warpzone-launcher-$V-macos-universal; mkdir -p $d; uni warpzone warpzone-universal
          packaging/macos/build-app.sh $PWD/warpzone-universal $V $d; legal $d launcher
          tar -czf dist/$d.tar.gz $d; rm -rf $d warpzone-universal
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .toolchain/android/downloads
          key: android-toolchain-${{ hashFiles('tools/fetch-android.sh') }}
      - name: Build the Android launcher (release key)
        env:
          WZ_ANDROID_KEYSTORE_B64: ${{ secrets.WZ_ANDROID_KEYSTORE_B64 }}
          WZ_ANDROID_KS_PASS: ${{ secrets.WZ_ANDROID_KS_PASS }}
        run: |
          set -eu
          tools/fetch-android.sh
          [ -n "$WZ_ANDROID_KEYSTORE_B64" ] || { echo "release key secrets missing" >&2; exit 1; }
          echo "$WZ_ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          WZ_VERSION=${GITHUB_REF_NAME#v} WZ_ANDROID_KEYSTORE="$RUNNER_TEMP/release.jks" JAVA_HOME= ANDROID_HOME= android/build.sh
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  publish:
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          V=${GITHUB_REF_NAME#v}
          awk -v v="## $V" '$0 ~ "^## " {p = index($0, v) == 1} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Warpzone $V" > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Warpzone ${GITHUB_REF_NAME#v}" --notes-file notes.md $([[ "$GITHUB_REF_NAME" == v0.* ]] && echo --prerelease)
      - name: Container image (ghcr.io)
        continue-on-error: true
        run: |
          V=${GITHUB_REF_NAME#v}
          SHA=$(grep "warpzone-server-$V-x86_64-linux-musl$" dist/SHA256SUMS | cut -d' ' -f1)
          echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -f deploy/Dockerfile.release --build-arg WARPZONE_VERSION=$V --build-arg WARPZONE_SHA256=$SHA -t ghcr.io/${{ github.repository }}:$V -t ghcr.io/${{ github.repository }}:latest deploy
          docker push ghcr.io/${{ github.repository }}:$V
          docker push ghcr.io/${{ github.repository }}:latest
