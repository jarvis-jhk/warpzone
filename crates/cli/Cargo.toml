[package]
name = "warpzone-cli"
description = "wz — Warpzone command-line tool for players, mod authors, moderators and server operators"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "wz"
path = "src/main.rs"

# TLS crypto, passed on to warpzone-core: see its Cargo.toml.
[features]
default = ["ring"]
ring = ["warpzone-core/ring"]
pure-rust-crypto = ["warpzone-core/pure-rust-crypto"]

[dependencies]
warpzone-core.workspace = true
warpzone-protocol.workspace = true
serde = { workspace = true }
serde_json.workspace = true

[lints]
workspace = true
