[package]
name = "warpzone-server"
description = "Warpzone server: rooms, NAT traversal and relay, ladder, leaderboards, mod archive, website"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "warpzone-server"
path = "src/main.rs"

[dependencies]
warpzone-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
semver.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
rand.workspace = true
ed25519-dalek.workspace = true
log.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "multipart"] }
tokio-util = { version = "0.7", features = ["io"] }
rusqlite = { version = "0.37", features = ["bundled"] }
socket2 = "0.6"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tempfile = "3"
