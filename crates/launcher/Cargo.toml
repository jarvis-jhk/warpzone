[package]
name = "warpzone-launcher"
description = "Warpzone launcher: install and update games, browse rooms across games, mods, ladder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "warpzone"
path = "src/main.rs"

# TLS crypto, passed on to warpzone-core: see its Cargo.toml.
[features]
default = ["ring"]
ring = ["warpzone-core/ring"]
pure-rust-crypto = ["warpzone-core/pure-rust-crypto"]

[dependencies]
warpzone-core.workspace = true
warpzone-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
log.workspace = true
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tiny-skia = "0.11"
ab_glyph = "0.2"
gilrs = "0.11"
crc32fast = "1"

[lints]
workspace = true
