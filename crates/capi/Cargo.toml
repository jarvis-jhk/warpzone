[package]
name = "warpzone-capi"
description = "Warpzone C library (libwarpzone): include/warpzone.h"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "warpzone"
crate-type = ["staticlib", "cdylib", "rlib"]

# TLS crypto, passed on to warpzone-core: see its Cargo.toml.
[features]
default = ["ring"]
ring = ["warpzone-core/ring"]
pure-rust-crypto = ["warpzone-core/pure-rust-crypto"]

[dependencies]
warpzone-core.workspace = true
warpzone-protocol.workspace = true
serde_json.workspace = true

[lints]
workspace = true
