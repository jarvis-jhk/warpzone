# nginx in front of warpzone-server (TLS terminated here; certbot --nginx can
# manage the certificate). The daemon itself listens on 127.0.0.1:2998.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name warpzone.example.org;

  ssl_certificate     /etc/letsencrypt/live/warpzone.example.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/warpzone.example.org/privkey.pem;

  # Mod uploads; the server enforces each game's own limit below this.
  client_max_body_size 80M;

  location / {
    proxy_pass http://127.0.0.1:2998;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    # /api/v1/events is a long poll (up to 30 s).
    proxy_read_timeout 75s;
    proxy_buffering off;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name warpzone.example.org;
  return 301 https://$host$request_uri;
}
