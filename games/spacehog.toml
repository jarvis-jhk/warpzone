# Operation Spacehog — JARVIS's native port of the 2000 DOS freeware shoot'em up,
# verified tick by tick against the original. Needs the freeware's original data
# files; the game reads the folder the launcher found from WARPZONE_DATA_GAME.
# Roadmap: lockstep netplay for 2 (later 4) players, mods as per-object overrides
# of the original datafiles, score leaderboards.
id = "spacehog"
name = "Operation Spacehog"
tagline = "The 2000 freeware shoot'em up, ported natively and verified tick by tick against the DOS original, for one or two players with gamepads."
description = """
A native port of Operation Spacehog 1.01 by Free Lunch Design: same logic, timing, graphics and FM music as the DOS original, with a resizable window, fullscreen and gamepads for both players. Linux, Windows and the Steam Deck.

The game data is the original freeware release: the launcher downloads it by itself (half a megabyte, checked against its known checksum), or finds sh_dos.zip if you already have it in your Downloads folder. Warpzone will bring online co-op, score leaderboards and mods."""
homepage = "https://github.com/jarvis-jhk/spacehog"
accent = "#a855f7"
tier = 0
local_players = 2
status = "preview"
requires = "the original Operation Spacehog freeware data (SPACEHOG.DAT and three more files), which the launcher downloads for you"

[install]
github = "jarvis-jhk/spacehog"
prerelease = true
checksums = "SHA256SUMS"
assets = { linux = "spacehog-linux-x86_64.tar.gz", deck = "spacehog-linux-x86_64.tar.gz", windows = "spacehog-windows-x86_64.zip", macos = "spacehog-macos-universal.tar.gz" }

[launch]
exec = { linux = "spacehog/spacehog", deck = "spacehog/spacehog", windows = "spacehog/spacehog.exe", macos = "spacehog/spacehog" }

[rooms]
max_players = 4
presets = [{ id = "coop", label = "co-op" }]
display = [{ key = "level", label = "Level" }]

[mods]
contains_code = false
max_size_mb = 16
categories = [
  { id = "level", label = "Levels" },
  { id = "graphics", label = "Graphics" },
  { id = "ship", label = "Ships" },
  { id = "sound", label = "Sounds" },
  { id = "music", label = "Music" },
  { id = "campaign", label = "Campaigns" },
]

[[leaderboards]]
id = "score-1p"
title = "High score, one player"
kind = "score"
seasonal = true

[[leaderboards]]
id = "score-2p"
title = "High score, two players"
kind = "score"
seasonal = true

[[data]]
id = "game"
label = "Operation Spacehog 1.01 data (SPACEHOG.DAT, SHLEV.DAT, SHBGS.DAT, SHSND.DAT)"
description = "The original freeware release by Free Lunch Design. The launcher downloads it by itself when you install the game. If you already have sh_dos.zip, leave it in Downloads: the files are found inside it too (sh_install.zip is a Windows installer, its files are found only after running it)."
files = ["./SPACEHOG.DAT"]
discs = false
free = [{ label = "sh_dos.zip from the DOS Games Archive (freeware)", url = "https://www.dosgamesarchive.com/file/operation-spacehog/sh_dos" }]
# README.TXT of the release: "Operation Spacehog is freeware, anybody may (and
# should) play it. Therefore, you are encouraged to distribute this game (in
# it's original form) like crazy." (not in commercial compilations). The
# launcher only downloads the unchanged original for the player. Both files
# hold the same spacehog.zip (sha256 a620d38f…): the DOS Games Archive's
# sh_dos.zip wraps it; the second is the author's own 2000 download page as
# archived by the Wayback Machine.
fetch = [
  { label = "DOS Games Archive", url = "https://www.dosgamesarchive.com/file.php?id=1001", file = "sh_dos.zip", size = 554767, sha256 = "4e3b15c2ca24f2706cb9f805e44b2a6427ac84c60faef068904bc1e98d0a34f3", license = "Freeware by Free Lunch Design: \"you are encouraged to distribute this game (in its original form)\" (README.TXT)" },
  { label = "Free Lunch Design's own site (Wayback Machine)", url = "https://web.archive.org/web/20010604220729id_/http://www.dtek.chalmers.se:80/~d98peitz/spacehog/download/spacehog.zip", file = "spacehog.zip", size = 549552, sha256 = "a620d38f6e75e8e85baa41f5b5693423e14f3b5d6013aeb0323989ef63f7398d", license = "Freeware by Free Lunch Design: \"you are encouraged to distribute this game (in its original form)\" (README.TXT)" },
]
# No import or copy: the launcher passes the folder it found as WARPZONE_DATA_GAME
# on every start, and the game loads the files from there. sh_dos.zip holds
# spacehog.zip (the original release); the launcher (0.1.3+) looks into both and
# unpacks the game files into <warpzone home>/unpacked/. Launchers from 0.1.3
# download `fetch` into <warpzone home>/downloads/game/ when nothing is found.
