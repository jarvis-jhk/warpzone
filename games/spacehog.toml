# Operation Spacehog — JARVIS's native port of the 2000 DOS freeware shoot'em up,
# verified tick by tick against the original. Needs the freeware's original data
# files; the game reads the folder the launcher found from WARPZONE_DATA_GAME.
# Online co-op for 2 players: lockstep over Warpzone rooms (--warpzone-host,
# --warpzone-join {room}). Roadmap: 4 players, mods as per-object overrides of the
# original datafiles, score leaderboards.
id = "spacehog"
name = "Operation Spacehog"
tagline = "The 2000 freeware shoot'em up, ported natively and verified tick by tick against the DOS original, for one or two players with gamepads, at home or online."
description = """
A native port of Operation Spacehog 1.01 by Free Lunch Design: same logic, timing, graphics and FM music as the DOS original, with a resizable window, fullscreen and gamepads for both players. Linux, Windows and the Steam Deck.

The game data is the original freeware release, free to download; the launcher finds it in your Downloads folder. Two players can also play together online: one hosts a room, the other joins it from the launcher or with the room code. Score leaderboards and mods come later."""
homepage = "https://github.com/jarvis-jhk/spacehog"
accent = "#a855f7"
tier = 2
local_players = 2
status = "preview"
requires = "the original Operation Spacehog freeware data (SPACEHOG.DAT and three more files), a free download"

[install]
github = "jarvis-jhk/spacehog"
prerelease = true
checksums = "SHA256SUMS"
assets = { linux = "spacehog-linux-x86_64.tar.gz", deck = "spacehog-linux-x86_64.tar.gz", windows = "spacehog-windows-x86_64.zip" }

[launch]
exec = { linux = "spacehog/spacehog", deck = "spacehog/spacehog", windows = "spacehog/spacehog.exe" }
join = ["--warpzone-join", "{room}"]
host = ["--warpzone-host"]

[rooms]
max_players = 2
presets = [{ id = "coop", label = "co-op" }]
display = [{ key = "level", label = "Level" }]

# [mods] (categories level, graphics, ship, sound, music, campaign) and the
# leaderboards score-1p / score-2p come back when the game implements them.

[[data]]
id = "game"
label = "Operation Spacehog 1.01 data (SPACEHOG.DAT, SHLEV.DAT, SHBGS.DAT, SHSND.DAT)"
description = "The original freeware release by Free Lunch Design. Unpack its zip anywhere, for example in Downloads; the game reads the files from there."
files = ["./SPACEHOG.DAT"]
discs = false
free = [{ label = "DOS Games Archive (freeware)", url = "https://www.dosgamesarchive.com/download/operation-spacehog" }]
# No import or copy: the launcher passes the folder it found as WARPZONE_DATA_GAME
# on every start, and the game loads the files from there.
