# Diablo 2 Couch — couch co-op for Diablo II on D2Decomp.
id = "diablo2-couch"
name = "Diablo 2 Couch"
tagline = "Diablo II: Lord of Destruction for up to four players on one screen — one sofa, one hero each."
description = """
Couch co-op for Diablo II, built on D2Decomp, an open reimplementation of the engine: one shared camera, one controller and one hero per player, and personal inventories that never pause the game. Linux, the Steam Deck and Windows."""
homepage = "https://github.com/jarvis-jhk/diablo2-couch"
accent = "#a16207"
steamgriddb = 37743   # Diablo II — library art, looked up at run time
tier = 0
local_players = 4
status = "in development"
requires = "your own Diablo II: Lord of Destruction data"

motif = "ruins"

[install]
github = "jarvis-jhk/diablo2-couch"
prerelease = true
# CPack names, case as built: d2d-<version>-Linux-x86_64.tar.gz, d2d-<version>-Windows-AMD64.zip,
# each with one top-level folder of the same name (verified on CI artifacts of dbf5db0).
# Linux/Deck since v0.0.5: the tarball brings its own libraries and needs
# glibc 2.28 (v0.0.1-0.0.4 needed 2.43). The .flatpak bundles are not used.
assets = { linux = "d2d-*-Linux-x86_64.tar.gz", deck = "d2d-*-Linux-x86_64.tar.gz", windows = "d2d-*-Windows-AMD64.zip" }

[launch]
exec = { linux = "d2d-*-Linux-x86_64/d2d", deck = "d2d-*-Linux-x86_64/d2d", windows = "d2d-*-Windows-AMD64/d2d.exe" }

[[data]]
id = "d2lod"
label = "Diablo II + Lord of Destruction (classic) game folder"
description = "The folder of your installed classic Diablo II with the expansion (it contains d2exp.mpq). Resurrected does not work."
files = ["./d2exp.mpq"]
gog = ["Diablo II"]
import_args = ["--data", "{path}"]
buy = [{ label = "Blizzard shop", url = "https://shop.battle.net/" }]
