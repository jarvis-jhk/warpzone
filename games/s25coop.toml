# The Settlers II: Coop — a Return To The Roots fork where many players share
# one tribe. Keeps RTTR's upstream lobby; Warpzone rooms appear next to it in
# the game's own browser once integrated.
id = "s25coop"
name = "The Settlers II: Coop"
tagline = "The Settlers II campaigns together: many players, one tribe — on one TV or over the internet."
description = """
A fork of Return To The Roots in which several players run one tribe together, locally with controllers or online, with a controller-friendly front end and a Steam Deck installer. Linux and Windows.

Warpzone adds rooms without port forwarding, and a mod archive for maps, scenarios and campaigns."""
homepage = "https://github.com/jarvis-jhk/s25coop"
accent = "#3b82f6"
# Install/launch only for now: RTTR's network traffic is TCP, so tier 0's UDP tunnel does not apply.
# join/host below are the planned tier 1/2 arguments (s25coop ROADMAP, W2/W3).
tier = 0
requires = "the original The Settlers II data (GOG installer or CD) — the installer extracts it"

motif = "castle"

[install]
github = "jarvis-jhk/s25coop"
assets = { linux = "s25coop-*-linux-x86_64.tar.gz", deck = "s25coop-*-linux-x86_64.tar.gz", windows = "s25coop-*-windows-x64.zip" }

[launch]
exec = { linux = "s25coop/s25coop.sh", deck = "s25coop/s25coop.sh", windows = "s25coop/s25client.exe" }
join = ["--warpzone-join", "{room}"]
host = ["--warpzone-host"]

[rooms]
max_players = 16
presets = [{ id = "campaign", label = "campaign" }, { id = "map", label = "free game" }]
display = [{ key = "map", label = "Map" }, { key = "chapter", label = "Chapter" }]

[mods]
categories = [
  { id = "map", label = "Maps" },
  { id = "scenario", label = "Scenarios" },
  { id = "campaign", label = "Campaigns" },
]
contains_code = true
max_size_mb = 50

[[data]]
id = "s2-gold"
label = "The Settlers II (Gold Edition) game files"
description = "An installed copy with its DATA and GFX folders, a copy of the CD, or the GOG offline installer (setup_the_settlers_2_gold_….exe) — s25coop takes the files out of it itself."
# An installed copy (the folder holding DATA), or the GOG installer, which s25coop unpacks on Linux/Deck.
files = ["DATA/IO/IO.DAT", "setup_the_settlers_2*.exe", "setup_die_siedler_2*.exe"]
gog = ["Settlers 2 GOLD", "The Settlers 2 Gold Edition", "Settlers 2"]
# No copy_to and no import_args: the game reads WARPZONE_DATA_S2_GOLD on every start (s25coop >= 0.1.21).
# Linux/Deck s25coop.sh imports it once into ~/.local/share/s25coop/S2 (folder, disc or GOG installer);
# Windows s25client uses a found folder in place. A copy_to would copy a found installer file into S2/.
# No known fingerprints: any copy with DATA and GFX works, and editions/languages differ.
# DATA alone is a half copy; the game needs GFX too, so check a file from it (Windows: next to the exe).
present = ["~/.local/share/s25coop/S2/GFX/PALETTE/PAL5.BBM", "{install}/s25coop/GFX/PALETTE/PAL5.BBM"]
buy = [{ label = "GOG.com", url = "https://www.gog.com/en/game/the_settlers_2_gold_edition" }]
