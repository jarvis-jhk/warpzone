# Super Mario Land — JARVIS's cycle-exact C port. Loads everything from the
# player's own ROM. Roadmap: mod ecosystem with typed packages and transitive
# dependencies, speedrun timer, and shared-screen co-op for up to 16 players,
# each playing their own game.
id = "super-mario-land-port"
name = "Super Mario Land"
tagline = "A cycle-exact port of the Game Boy classic, with widescreen, speedrun tools and mods — up to 16 players side by side."
description = """
A native C port of Super Mario Land that loads every graphic, level and sound from your own ROM and plays back every tool-assisted speedrun frame-perfectly. Releases for Linux, Windows, the Steam Deck and PortMaster handhelds.

Warpzone brings its mod archive (levels, worlds, tilesets, skins, Lua behaviours), leaderboards for speedruns, and a shared-screen mode where up to 16 players each play their own game and watch everyone else's."""
homepage = "https://github.com/jarvis-jhk/super-mario-land-port"
accent = "#ef4444"
tier = 0
status = "in development"
requires = "your own Super Mario Land ROM — none is included or downloadable here"

motif = "pipes"

[install]
github = "jarvis-jhk/super-mario-land-port"
prerelease = true
checksums = "SHA256SUMS"
assets = { linux = "super-mario-land-port-*-linux-x86_64.tar.gz", deck = "super-mario-land-port-*-linux-x86_64.tar.gz", windows = "super-mario-land-port-*-windows-x86_64.zip", portmaster = "super-mario-land-port-*-portmaster.zip" }

[launch]
# The archives hold one versioned folder: super-mario-land-port-<version>-<platform>/
exec = { linux = "*/sml", deck = "*/sml", windows = "*/sml.exe" }
join = ["--warpzone-join", "{room}"]
host = ["--warpzone-host"]

[rooms]
max_players = 16
presets = [
  { id = "together", label = "shared screens" },
  { id = "race", label = "race" },
]
display = [{ key = "world", label = "World" }, { key = "mode", label = "Mode" }]

[mods]
contains_code = true
max_size_mb = 64
categories = [
  { id = "skin", label = "Skins" },
  { id = "player", label = "Players" },
  { id = "enemy", label = "Enemies" },
  { id = "tileset", label = "Tilesets" },
  { id = "level", label = "Levels" },
  { id = "world", label = "Worlds" },
  { id = "worldset", label = "Campaigns" },
  { id = "music", label = "Music" },
  { id = "theme", label = "Themes" },
  { id = "behavior", label = "Lua behaviours" },
]

[[leaderboards]]
id = "any"
title = "Full game, any%"
kind = "time"
seasonal = true

[[leaderboards]]
id = "1-1"
title = "World 1-1"
kind = "time"

[[data]]
id = "rom"
label = "Super Mario Land ROM (World, Rev A / v1.1)"
description = "A dump of your own Game Boy cartridge. Warpzone never downloads, uploads or shares ROMs; it only finds the file you already have."
files = ["*super mario land*.gb", "sml.gb"]
discs = false
# Started once with --rom under WARPZONE_LAUNCHED=1, the game keeps a copy as
# sml.gb in its data directory (v0.2.0+), where later starts find it.
import_args = ["--rom", "{path}"]
present = ["~/.local/share/super-mario-land-port/sml.gb"]
known = [
  { label = "World, Rev A (v1.1)", size = 65536, sha1 = "418203621b887caa090215d97e3f509b79affd3e", sha256 = "49fbd2f61f953d5ef28cab73e357e524c3009ad19fcf30f6a9ee0ae273be41dc" },
  { label = "World (v1.0) — not supported yet", size = 65536, sha1 = "3a4ddb39b234a67ffb361ee7abc3d23e0a8b1c89", sha256 = "470d6c45c9bcf7f0397d00c1ae6de727c63dd471049c8eedbefdc540ceea80b4", supported = false },
]
