# Funny Furries — JARVIS's SDL2 rebuild of the 1999 brawler.
# Since v0.4.0 it links libwarpzone: --warpzone-join/--warpzone-host, code
# rooms, direct/relayed play and the three ranked queues below. Since v0.5.0
# it syncs mods (active.lock.json, lockfile in wz_host/wz_queue as ruleset,
# wz_sync_mods); data only (text, PNG, WAV), loaded unpacked — tier 3, which
# is what marks mods as usable. Not yet: public room browser, host approval,
# leaderboards.
id = "funny-furries"
name = "Funny Furries"
tagline = "The chaotic 1999 couch brawler, rebuilt: up to four furries, one arena, far too many weapons."
description = """
A faithful SDL2 reimplementation of Funny Furries 2 Xmas, the Click & Create brawler by Bastiaan de Jong. Up to four players share one screen with controllers on Linux, Windows and the Steam Deck.

Rollback online play, ranked 1 vs 1, free-for-all and 2 vs 2 come through Warpzone."""
homepage = "https://github.com/jarvis-jhk/funny-furries"
accent = "#f59e0b"
tier = 3
local_players = 4
status = "preview"
requires = "your own copy of Funny Furries 2 Xmas — the game imports it at first start"

motif = "arena"

[install]
github = "jarvis-jhk/funny-furries"
prerelease = true
checksums = "SHA256SUMS"
assets = { linux = "funny-furries-linux-deck-x86_64.tar.gz", deck = "funny-furries-linux-deck-x86_64.tar.gz", windows = "funny-furries-windows-x86_64.zip" }

[launch]
exec = { linux = "funny-furries/play.sh", deck = "funny-furries/play.sh", windows = "funny-furries/Play-Funny-Furries.exe" }
join = ["--warpzone-join", "{room}"]
host = ["--warpzone-host"]

[rooms]
max_players = 4
presets = [
  { id = "1v1", label = "1 vs 1" },
  { id = "ffa", label = "free-for-all" },
  { id = "2v2", label = "2 vs 2" },
]
display = [{ key = "arena", label = "Arena" }, { key = "mode", label = "Mode" }]

[mods]
categories = [
  { id = "arena", label = "Arenas", description = "New levels drawn as pictures, with the original devices" },
  { id = "weapon", label = "Weapons", description = "New or changed weapons: bouncing, homing, exploding, spread shots" },
  { id = "rules", label = "Rules", description = "Gravity, jump height, lives" },
  { id = "skin", label = "Skins", description = "Replacement images (own art only)" },
  { id = "sound", label = "Sounds", description = "Replacement or extra sound effects" },
]
max_size_mb = 20
contains_code = false
install = "extract"

[[ladder]]
id = "1v1"
title = "1 vs 1"
teams = 2

[[ladder]]
id = "ffa"
title = "Free-for-all (4)"
teams = 4

[[ladder]]
id = "2v2"
title = "2 vs 2"
teams = 2
team_size = 2

[[data]]
id = "ff2xmas"
label = "Funny Furries 2 Xmas (full version)"
description = "The original game's funnyfurries.zip or its FF2xmas.cca file. Funny Furries imports it on first start; Warpzone only finds it for you."
files = ["funnyfurries.zip", "FF2xmas.cca"]
free = [{ label = "Kliktopia archive", url = "https://kliktopia.org/details/funnyfurry2xmas.html" }]
# The game's first-start launcher takes --import-copy; a bare --import is
# ambiguous to it (--import-copy / --import-only) and exits with an error.
import_args = ["--import-copy", "{path}"]
# Written only after a successful import (Linux/Deck, then Windows).
present = ["~/.local/share/funny-furries/selected.json", "~/AppData/Local/funny-furries/selected.json"]
known = [
  { label = "Full version ZIP (Kliktopia)", size = 1858506, sha1 = "d6902a149e94156966a11cc9662cd03780895629", sha256 = "9b2434fa0fc7f6929f105cfed1e01ac0668bf758da43aeffc2629ba02f690a35" },
  { label = "Full version FF2xmas.cca", size = 3083402, sha1 = "af2e9d320029b952928b6698b07c297e04e61de4", sha256 = "4f1acb689b0becab6a2364ab47bbf9e361b9a385ad9d95ae24c64f1cd34bf22b" },
]
